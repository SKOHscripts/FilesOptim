[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "filesoptim"
version = "2.0.0"
description = "Linux maintenance toolkit: lossless file optimisation, smart sorting and tagging, cache cleaning, duplicates and disk reports."
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [{ name = "Corentin Michel", email = "corentin.michel@mailo.com" }]
requires-python = ">=3.10"
keywords = ["linux", "maintenance", "optimisation", "jpeg", "png", "pdf", "video", "exif", "duplicates"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = [
    "Pillow>=10.0",
    "mutagen>=1.47",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
filesoptim = "filesoptim.cli:main"

[project.urls]
Homepage = "https://github.com/SKOHscripts/FilesOptim"

[tool.hatch.build.targets.wheel]
packages = ["src/filesoptim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs the real external tools (ffmpeg, jpegoptim, qpdf, exiftool...)"]

[tool.coverage.run]
source = ["filesoptim"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@(abc\\.)?abstractmethod"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "C4"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"src/filesoptim/config.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src/filesoptim"]

[[tool.mypy.overrides]]
module = ["mutagen", "mutagen.*", "tomli"]
ignore_missing_imports = true
